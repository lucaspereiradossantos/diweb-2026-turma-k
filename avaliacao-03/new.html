<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Arena | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <a class="logo" href="index.html">PIXEL<span>ARENA</span></a>
    <nav aria-label="Menu principal">
        <a href="index.html" >Início</a>
        <a href="produto.html" >Produtos</a>
        <a href="login.html" >Entrar</a>
        <a class="nav-cta" href="new.html">Criar conta</a>
    </nav>
</header>
<main>
    <section class="area-formulario">
        <div class="formulario">
            <p class="destaque">Faça parte da comunidade</p>
            <h1>Criar cadastro</h1>
            <p class="descricao">Preencha os campos para criar sua conta.</p>

            <form onsubmit="event.preventDefault(); alert('Cadastro demonstrativo. Os dados não são armazenados.');">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <label for="apelido">Nome de usuário</label>
                <input type="text" id="apelido" name="apelido" placeholder="Escolha um usuário" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="6" placeholder="Mínimo de 6 caracteres" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" minlength="6" placeholder="Digite a senha novamente" required>

                <button class="botao" type="submit">Cadastrar</button>
            </form>

            <p class="texto-formulario">Já possui conta? <a href="login.html">Entrar</a></p>
            <p class="texto-formulario"><a href="index.html">Voltar para o início</a></p>
        </div>
    </section>
</main>
<footer>
    <p>© 2026 Pixel Arena - Projeto acadêmico de Lucas Pereira.</p>
    <div><a href="produto.html">Produtos</a><a href="login.html">Entrar</a></div>
</footer>
</body>
</html>
