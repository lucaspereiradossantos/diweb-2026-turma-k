<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Arena | Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <a class="logo" href="index.html">PIXEL<span>ARENA</span></a>
    <nav aria-label="Menu principal">
        <a href="index.html" >Início</a>
        <a href="produto.html" >Produtos</a>
        <a href="login.html" class="active">Entrar</a>
        <a class="nav-cta" href="new.html">Criar conta</a>
    </nav>
</header>
<main>
    <section class="area-formulario">
        <div class="formulario">
            <p class="destaque">Bem-vindo de volta</p>
            <h1>Entrar na conta</h1>
            <p class="descricao">Informe seus dados para continuar.</p>

            <form onsubmit="event.preventDefault(); alert('Este é um formulário demonstrativo. O login ainda não está conectado a um servidor.');">
                <label for="usuario">E-mail ou usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <button class="botao" type="submit">Entrar</button>
            </form>

            <p class="texto-formulario">Ainda não tem cadastro? <a href="new.html">Criar conta</a></p>
            <p class="texto-formulario"><a href="index.html">Voltar para o início</a></p>
        </div>
    </section>
</main>
<footer>
    <p>© 2026 Pixel Arena - Projeto acadêmico de Lucas Pereira.</p>
    <div><a href="produto.html">Produtos</a><a href="login.html">Entrar</a></div>
</footer>
</body>
</html>
