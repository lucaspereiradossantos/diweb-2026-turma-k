<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio02</title> 
    <link rel="stylesheet" href="style.css"> 
    <style>
   * {
    margin: 0; 
    padding: 0; 
    box-sizing: border-box;
   }
   body {
    font-family: Verdana, sans-serif; 
    font-size: 22px;
   }
   h1 {
    text-align: center; 
    font-family: cursive; 
    font-size: 66px;
   }
   p {
    color: white; 
    margin: 50px; 
    padding: 20px;
   } 
   .simples {
  color: blueviolet; 
  border: 3px solid green; 
}
 .pizza {
    width: 150px; 
    border-radius: 50%; 
    border: 5px solid darkorange; 
    margin-left: 50px;
 }
 .personalizada {
    border-top: 5px dotted green; 
    border-right: 4px double red; 
    border-bottom: 3px solid blueviolet; 
    border-left: 16px solid orange; 
    background-color: gray;
 }
    </style>
</head>
<body>
    <img class="pizza" src="pizza.jpg" alt="Imagem de uma fatia de pizza"> 

    <h1>Bem vindo a Pizzaria ETC</h1> 

    <p class= "simples">
      Esta caixa tem uma borda simples.
    </p> 

    <p class="personalizada">
      Esta caixa tem bordas personalidadas para cada um dos lados.
    </p>
</body>
</html>
