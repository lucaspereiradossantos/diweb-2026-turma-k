<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio01</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form method="post" accept="pdf" enctype="multipart/form-data">
        <h1>Ouvidoria</h1>
        <input type="hidden" name="acao" value="adicionar">
        <label for="email">Nome</label>
        <span class="obrigatorio">*</span>
        <br>
        <input type="text" name="nome" id="nome" size="100" required placeholder="Informe seu nome" autofocus>
        <br>
        <label for="email">E-mail</label>
        <span class="obrigatorio">*</span>
        <br>
        <input type="text" name="email" id="email" size="100" required placeholder="Informe seu email" autofocus>
        <br>
        <label for="tipo">Tipo de solicitação</label>
        <span class="obrigatorio">*</span>
        <br>
        <select name="tipo" id="tipo" required>
            <option value="">Selecione...</option>
            <option value="reclamacao">Reclamação</option>
            <option value="elogio">Elogio</option>
            <option value="sugestao">Sugestão</option>
        </select>
        <br>
        <label for="mensagem">Menasgem</label>
        <span class="obrigatorio">*</span>
        <br>
        <textarea name="mensagem" id="mensagem" rows="5" cols="98" placeholder="Digite sua mensagem aqui."
            required></textarea>
        <label for="anexo">Anexo</label>
        <span class="obrigatorio">(opicional - Aceita somente arquivos PDF)</span>
        <input type="file" name="anexo" id="anexo" accept="pdf">
        <br>
        <input type="submit" value="Enviar" class="button">
        <input type="reset" value="Limpar" class="button">
    </form>
</body>

</html>
